{% extends 'tickets/base.html' %}
{% block content %}
  <h1>Validate Ticket</h1>
  {% if message %}
    <div class="alert alert-info">{{ message }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-2">
      <label>Ticket code</label>
      <input name="code" class="form-control" placeholder="Paste ticket UUID or scan and paste" required>
    </div>
    <button class="btn btn-primary">Validate</button>
  </form>
  {% if ticket %}
    <div class="mt-3">
      <h5>Ticket: {{ ticket.code }}</h5>
      <p>Purchase: {{ ticket.purchase }}</p>
      <p>Validated: {{ ticket.is_validated }}</p>
    </div>
  {% endif %}
{% endblock %}
